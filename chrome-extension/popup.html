<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twitch Streak Saver</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #181818;
        --foreground: #f5f5f5;
        --border: #666;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --background: #fff;
        --foreground: #1a1a1a;
        --border: #777;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: #181818;
        --foreground: #f5f5f5;
        --border: #666;
      }
      :root[data-theme="amoled"] {
        color-scheme: dark;
        --background: #000;
        --foreground: #fff;
        --border: #666;
      }
      :root[data-theme="system"] {
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: light) {
        :root[data-theme="system"] {
          --background: #fff;
          --foreground: #1a1a1a;
          --border: #777;
        }
      }
      @media (prefers-color-scheme: dark) {
        :root[data-theme="system"] {
          --background: #181818;
          --foreground: #f5f5f5;
          --border: #666;
        }
      }
      body {
        box-sizing: border-box;
        width: 372px;
        color: var(--foreground);
        background: var(--background);
        font: 14px system-ui, sans-serif;
        margin: 0;
        padding: 16px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 10px;
      }
      p {
        line-height: 1.4;
        margin: 6px 0;
      }
      section {
        border-top: 1px solid var(--border);
        margin-top: 12px;
        padding-top: 10px;
      }
      .actions {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }
      #status {
        min-height: 2.5em;
      }
      #action-status {
        min-height: 1.4em;
        margin-top: 8px;
      }
      button {
        box-sizing: border-box;
        width: 100%;
        min-height: 34px;
        padding: 0 12px;
        cursor: pointer;
        background: var(--background);
        border: 1px solid var(--border);
        color: inherit;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      button:focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Twitch Streak Saver</h1>
      <p id="status" role="status" aria-live="polite">Waking the extension worker…</p>
      <section aria-labelledby="managed-heading">
        <strong id="managed-heading">Managed streams</strong>
        <p id="managed-streams">Checking managed streams…</p>
      </section>
      <div class="actions">
        <button id="pause" type="button">Pause automation · 15 min</button>
        <button id="open-selected" type="button">Open selected channels</button>
      </div>
      <p id="action-status" role="status" aria-live="polite"></p>
      <button id="wake" type="button">Wake / reconnect</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
