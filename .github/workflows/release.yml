name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Cargo and macOS bundle version without the leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-and-tag:
    name: Validate release and create tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.validate.outputs.sha }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate branch, version, and CI
        id: validate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'Run this workflow from the default branch (%s).\n' "$DEFAULT_BRANCH" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a version like 0.1.0; got %s\n' "$RELEASE_VERSION" >&2
            exit 1
          fi
          default_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${DEFAULT_BRANCH}" --jq .commit.sha)"
          if [[ "$GITHUB_SHA" != "$default_sha" ]]; then
            printf 'Dispatch from the current default-branch commit (%s).\n' "$default_sha" >&2
            exit 1
          fi
          python3 - "$RELEASE_VERSION" <<'PY'
          import plistlib
          import sys
          import tomllib
          from pathlib import Path

          requested = sys.argv[1]
          cargo_version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          info = plistlib.loads(Path("packaging/macos/Info.plist").read_bytes())
          bundle_versions = (info["CFBundleShortVersionString"], info["CFBundleVersion"])
          if requested != cargo_version or any(version != requested for version in bundle_versions):
              raise SystemExit(
                  f"release version {requested} must match Cargo.toml ({cargo_version}) "
                  f"and both macOS bundle versions ({', '.join(bundle_versions)})"
              )
          PY
          successful_ci="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=${DEFAULT_BRANCH}&status=completed&per_page=100" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [[ "$successful_ci" -lt 1 ]]; then
            printf 'CI has not passed on %s at %s.\n' "$DEFAULT_BRANCH" "$GITHUB_SHA" >&2
            exit 1
          fi
          tag="v${RELEASE_VERSION}"
          releases="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          existing_release="$(jq -c --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | first' <<<"$releases")"
          if [[ "$existing_release" != "null" && "$(jq -r '.draft' <<<"$existing_release")" != "true" ]]; then
            printf 'Release %s is already published and cannot be reused; choose a new version.\n' "$tag" >&2
            exit 1
          fi
          if existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha 2>/dev/null)"; then
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              printf 'Release tag %s already points to a different commit.\n' "$tag" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${tag}" \
              -f "sha=${GITHUB_SHA}" >/dev/null
          fi
          printf 'tag=%s\nsha=%s\nversion=%s\n' "$tag" "$GITHUB_SHA" "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  package-macos:
    name: Build macOS app and Chrome extension assets
    needs: validate-and-tag
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate-and-tag.outputs.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable

      - name: Install macOS Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Build macOS app binaries
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: cargo build --locked --release --target aarch64-apple-darwin --bins

      - name: Package Chrome extension
        run: python3 scripts/package_chrome_extension.py

      - name: Assemble and verify macOS release assets
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          RELEASE_VERSION: ${{ needs.validate-and-tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist"
          assets="$RUNNER_TEMP/release-assets"
          app="$dist/macos/Twitch Streak Saver.app"
          rm -rf "$app" "$assets"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/chrome-extension" "$assets"

          cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/twitch-streak-saver" "$app/Contents/MacOS/twitch-streak-saver"
          cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/twitch_streak_saver_host" "$app/Contents/MacOS/twitch_streak_saver_host"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          cp -R "$dist/chrome-extension/." "$app/Contents/Resources/chrome-extension/"
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$assets/twitch-streak-saver-${RELEASE_VERSION}-macos-aarch64.zip"
          cp "$dist/twitch-streak-saver-chrome-extension.zip" "$assets/twitch-streak-saver-chrome-extension.zip"

          test -x "$app/Contents/MacOS/twitch-streak-saver"
          test -x "$app/Contents/MacOS/twitch_streak_saver_host"
          test -f "$app/Contents/Resources/chrome-extension/managed_tabs.js"
          unzip -tq "$assets/twitch-streak-saver-${RELEASE_VERSION}-macos-aarch64.zip"
          unzip -tq "$assets/twitch-streak-saver-chrome-extension.zip"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: twitch-streak-saver-release-${{ github.run_id }}-macos
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Build native Windows MSVC package
    needs: validate-and-tag
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate-and-tag.outputs.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable

      - name: Install Windows MSVC Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build Windows app binaries with static CRT
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bins

      - name: Package Chrome extension
        run: python scripts/package_chrome_extension.py

      - name: Assemble and verify Windows release asset
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          RELEASE_VERSION: ${{ needs.validate-and-tag.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
          $packageName = 'twitch-streak-saver-windows-x86_64-msvc'
          $windows = Join-Path $dist $packageName
          $packageExtension = Join-Path $windows 'chrome-extension'
          $extension = Join-Path $dist 'chrome-extension'
          $releaseBinaries = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc\release'

          Remove-Item -Recurse -Force $windows, $assets -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageExtension, $assets | Out-Null
          Copy-Item -LiteralPath (Join-Path $releaseBinaries 'twitch-streak-saver.exe') -Destination $windows
          Copy-Item -LiteralPath (Join-Path $releaseBinaries 'twitch_streak_saver_host.exe') -Destination $windows
          Copy-Item -Path (Join-Path $extension '*') -Destination $packageExtension -Recurse -Force

          $archiveName = "twitch-streak-saver-$env:RELEASE_VERSION-windows-x86_64-msvc.zip"
          $archive = Join-Path $assets $archiveName
          Compress-Archive -Path $windows -DestinationPath $archive -CompressionLevel Optimal

          $verifyRoot = Join-Path $env:RUNNER_TEMP 'verify-windows-package'
          Remove-Item -Recurse -Force $verifyRoot -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $verifyRoot
          $verifiedPackage = Join-Path $verifyRoot $packageName
          foreach ($relative in @(
            'twitch-streak-saver.exe',
            'twitch_streak_saver_host.exe',
            'chrome-extension\manifest.json',
            'chrome-extension\managed_tabs.js'
          )) {
            if (-not (Test-Path (Join-Path $verifiedPackage $relative))) {
              throw "Missing packaged Windows release file: $relative"
            }
          }
          if ((Get-ChildItem -Path $assets -File).Count -ne 1) {
            throw 'Expected exactly one Windows release asset.'
          }

      - name: Upload Windows release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: twitch-streak-saver-release-${{ github.run_id }}-windows
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7
  attest:
    name: Attest public release assets
    if: github.event.repository.visibility == 'public'
    needs: [validate-and-tag, package-macos, package-windows]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: twitch-streak-saver-release-${{ github.run_id }}-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/*

  publish:
    name: Publish GitHub release
    needs: [validate-and-tag, package-macos, package-windows, attest]
    if: always() && needs.validate-and-tag.result == 'success' && needs.package-macos.result == 'success' && needs.package-windows.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: twitch-streak-saver-release-${{ github.run_id }}-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Verify downloaded release assets
        env:
          RELEASE_VERSION: ${{ needs.validate-and-tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          expected=(
            "twitch-streak-saver-${RELEASE_VERSION}-macos-aarch64.zip"
            "twitch-streak-saver-${RELEASE_VERSION}-windows-x86_64-msvc.zip"
            "twitch-streak-saver-chrome-extension.zip"
          )
          file_count="$(find "$assets" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [[ "$file_count" != "${#expected[@]}" ]]; then
            printf 'Expected %s release assets; found %s.\n' "${#expected[@]}" "$file_count" >&2
            exit 1
          fi
          for file in "${expected[@]}"; do
            test -s "$assets/$file"
            unzip -tq "$assets/$file"
          done

      - name: Publish release
        id: release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ needs.validate-and-tag.outputs.tag }}
          name: Twitch Streak Saver ${{ needs.validate-and-tag.outputs.tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release-assets/twitch-streak-saver-${{ needs.validate-and-tag.outputs.version }}-macos-aarch64.zip
            ${{ runner.temp }}/release-assets/twitch-streak-saver-${{ needs.validate-and-tag.outputs.version }}-windows-x86_64-msvc.zip
            ${{ runner.temp }}/release-assets/twitch-streak-saver-chrome-extension.zip

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-and-tag.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-and-tag.outputs.version }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          if [[ "$(jq -r '.draft' <<<"$release_json")" != "true" ]]; then
            printf 'Release %s is not a draft; refusing to publish.\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          expected_assets="$(printf '%s\n' \
            "twitch-streak-saver-${RELEASE_VERSION}-macos-aarch64.zip" \
            "twitch-streak-saver-${RELEASE_VERSION}-windows-x86_64-msvc.zip" \
            "twitch-streak-saver-chrome-extension.zip" | sort)"
          actual_assets="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            printf 'Release %s has an unexpected asset set.\nExpected:\n%s\nActual:\n%s\n' \
              "$RELEASE_TAG" "$expected_assets" "$actual_assets" >&2
            exit 1
          fi

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false >/dev/null
